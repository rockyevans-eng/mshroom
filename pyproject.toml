[project]
name = "mshroom"
version = "0.1.0"
description = "MSHroom: a free, open-source HL7 v2 test utility -- viewer, MLLP sender, and listener."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Desktop window mode (`python -m mshroom`). Headless mode never
    # imports it, so servers without a WebView runtime still work.
    "pywebview>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Matches the longest lines already in the codebase -- the config adapts
# to the code, not the other way around.
line-length = 120

[tool.ruff.lint]
# Conservative on purpose: correctness (E, F), warnings (W), and import
# ordering (I). Nothing that forces large mechanical rewrites.
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hl7kit", "app", "mshroom", "mshroom.scenario"]
include-package-data = true

[tool.setuptools.package-data]
hl7kit = ["data/*.json"]
app = ["static/*.html", "static/*.js", "static/*.css"]
